name: tmp-probe
on:
  push:
    branches: [ci/windows-container]
env:
  DOTNET_NOLOGO: "1"
  OPENSSL_ENABLE_SHA1_SIGNATURES: "1"
jobs:
  windows-container:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BASE_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0-nanoserver-ltsc2025

    steps:
      - name: Line endings
        run: git config --global core.autocrlf false

      - name: Long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The engine is an automatic service that may still be starting when the job begins.
      - name: Docker engine
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) { docker version --format '{{.Server.Os}} {{.Server.Version}}' 2>$null; if ($LASTEXITCODE -eq 0) { break }; Start-Service docker -ErrorAction SilentlyContinue; Start-Sleep 2 }
          docker info --format '{{.OSType}} {{.KernelVersion}} isolation={{.Isolation}}'
          if ($LASTEXITCODE -ne 0) { throw "the Docker engine isn't running" }

      - name: Build webforcore-host and the MVC sample
        run: |
          dotnet build src/WebFormsForCore.Build/WebFormsForCore.Build.csproj -c Release
          dotnet build src/WebFormsForCore.Host/WebFormsForCore.Host.csproj -c Release -nodeReuse:false
          dotnet build test/webForCore.Mvc.Sample/webForCore.Mvc.Sample.csproj -c Release -nodeReuse:false

      - name: Stage the image's files
        run: |
          context="$RUNNER_TEMP/container"
          mkdir -p "$context"
          cp -r src/WebFormsForCore.Host/bin/Release/net10.0 "$context/host"
          cp -r test/webForCore.Mvc.Sample "$context/app"
          rm -rf "$context/app/obj"

      - name: Run and probe the container
        run: |
          docker pull "$BASE_IMAGE"
          echo "## webForCore in a Windows container" > "$RUNNER_TEMP/windows-container.md"
          status=0
          dotnet run tools/ci/windows_container.cs -- "$RUNNER_TEMP/container" "$BASE_IMAGE" 8080 "$RUNNER_TEMP/windows-container.md" || status=1
          cat "$RUNNER_TEMP/windows-container.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

