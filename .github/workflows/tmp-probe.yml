name: tmp-probe
on:
  push:
    branches: [ci/windows-container]
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - shell: pwsh
        continue-on-error: true
        run: |
          Get-Service | Where-Object { $_.Name -match 'docker|containerd|vmcompute|hns' } | Format-Table -AutoSize Name,Status,StartType
          Get-WindowsFeature Containers, Hyper-V | Format-Table -AutoSize Name,InstallState
          Get-Command dockerd -ErrorAction SilentlyContinue | Format-List Source
          Get-ChildItem 'C:\Program Files\Docker' -ErrorAction SilentlyContinue
      - shell: pwsh
        continue-on-error: true
        run: |
          Start-Service docker -ErrorAction Continue
          docker info
      - shell: pwsh
        continue-on-error: true
        run: |
          $d = (Get-Command dockerd -ErrorAction SilentlyContinue).Source
          if ($d) { & $d --register-service; Start-Service docker; Start-Sleep 5; docker info }
          Get-WinEvent -LogName Application -MaxEvents 30 | Where-Object { $_.ProviderName -match 'docker' } | Format-List TimeCreated,Message
      - shell: pwsh
        continue-on-error: true
        run: |
          docker pull mcr.microsoft.com/dotnet/aspnet:10.0-nanoserver-ltsc2025
          docker run --rm mcr.microsoft.com/dotnet/aspnet:10.0-nanoserver-ltsc2025 dotnet --list-runtimes
