# Temporary: loops the #214 and #219 tests on Linux and Windows (not for merging).
name: CI

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  OPENSSL_ENABLE_SHA1_SIGNATURES: "1"

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/WebFormsForCore.Build/WebFormsForCore.Build.csproj -c Release
      - run: dotnet build test/webForCore.IIS.Gate.Tests/webForCore.IIS.Gate.Tests.csproj -c Release -nodeReuse:false
      - name: Loop
        run: |
          pass=0; fail=0
          for i in $(seq 1 ${LOOPS:-30}); do
            if dotnet test test/webForCore.IIS.Gate.Tests/webForCore.IIS.Gate.Tests.csproj -c Release --no-build \
                --filter "FullyQualifiedName~RecyclingTests.RequestsWithBodies|FullyQualifiedName~RecyclingTests.RequestsDuring|FullyQualifiedName~ErrorsAndLimitsTests" > run.log 2>&1; then
              pass=$((pass+1)); echo "run $i: $(grep -E '^(Passed|Failed)!' run.log | cut -c1-90)"
            else
              fail=$((fail+1)); echo "run $i FAILED: $(grep -E '^(Passed|Failed)!' run.log | cut -c1-90)"
              grep -E "^\s+Failed |Error Message" -A6 run.log | cut -c1-400 | head -60
            fi
          done
          echo "## ${{ matrix.os }}: $pass of $((pass+fail)) runs passed" | tee -a "$GITHUB_STEP_SUMMARY"
