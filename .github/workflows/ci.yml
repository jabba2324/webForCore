# Linux and Windows builds in parallel (Windows is the development environment, #46), every test suite on both (see
# docs/TESTING.md), and the NuGet packages: every run packs them, checks that an application builds and runs from them,
# and keeps Linux's as the "packages" artifact. A version tag (v0.1.0, matching <Version> in Directory.Build.props) also
# publishes them as a GitHub release, once both platforms pass, and rebuilds the NuGet feed on GitHub Pages (feed.yml).
name: CI

on:
  push:
    branches: [webforcore-lift, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Strong-name signing is RSA-SHA1; distributions whose OpenSSL policy rejects SHA-1 need this (harmless elsewhere).
  OPENSSL_ENABLE_SHA1_SIGNATURES: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    services:
      # Identity.Test's Entity Framework tests (LocalDB on Windows); the same server tools/ci/sqlserver.sh starts.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "webForCore-Test1!"
        ports:
          - 14333:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'webForCore-Test1!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Microsoft's code comes from submodules of cleared-down forks (external/, #61).
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The release version from Directory.Build.props; any other run builds a prerelease of it (0.1.0-ci.123).
      - name: Version
        id: version
        run: |
          base=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/v}" != "$base" ]]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match <Version>$base</Version> in Directory.Build.props"; exit 1
            fi
            version=$base
          else
            version=$base-ci.$GITHUB_RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core libfontconfig1

      # The other projects import lib/WebFormsForCore.Build/*/FakeStrongName.targets, this project's output, so it is
      # built before the solution can even be restored.
      - name: Build the build tasks
        run: dotnet build src/WebFormsForCore.Build/WebFormsForCore.Build.csproj -c Release

      - name: Build
        run: dotnet build WebFormsForCore.slnx -c Release -nodeReuse:false -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: tools/ci/run-tests.sh "$RUNNER_TEMP/TestResults"

      - name: Test summary
        if: always()
        run: cat "$RUNNER_TEMP/TestResults/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

      - name: Pack
        run: tools/ci/pack.sh ${{ steps.version.outputs.version }} "$RUNNER_TEMP/packages"

      # An application that references the webForCore package (not the projects) builds, runs and serves pages.
      - name: Package smoke test
        run: tools/ci/package-smoke.sh "$RUNNER_TEMP/packages" ${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

  # Windows as a development environment (#46): the same build, tests, packing and package smoke test. Not a required
  # check yet; each step's failures are recorded while the differences from Linux are fixed or documented.
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      # Check files out as they are stored, as on Linux: core.autocrlf would give the shell scripts CRLF line endings.
      - name: Line endings
        run: git config --global core.autocrlf false

      - name: Long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the build tasks
        run: dotnet build src/WebFormsForCore.Build/WebFormsForCore.Build.csproj -c Release

      - name: Build
        run: dotnet build WebFormsForCore.slnx -c Release -nodeReuse:false -p:Version=0.0.0-windows.${{ github.run_number }}

      # Service containers are Linux only: SQL Server Express on the same port and login instead.
      - name: SQL Server
        shell: pwsh
        run: tools/ci/sqlserver-windows.ps1

      - name: Test
        run: tools/ci/run-tests.sh "$RUNNER_TEMP/TestResults"

      - name: Test summary
        if: always()
        run: cat "$RUNNER_TEMP/TestResults/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

      - name: Pack
        run: tools/ci/pack.sh 0.0.0-windows.${{ github.run_number }} "$RUNNER_TEMP/packages"

      - name: Package smoke test
        run: tools/ci/package-smoke.sh "$RUNNER_TEMP/packages" 0.0.0-windows.${{ github.run_number }}

  # A version tag: the tested packages become a GitHub release (not published to nuget.org), and the feed is rebuilt.
  release:
    # Both platforms must pass: Windows is the development environment (#46).
    needs: [build-and-test, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          webForCore $VERSION as NuGet packages, on the feed https://xforcore.github.io/webForCore/index.json (not on
          nuget.org). Add it and drawingForCore's feed (System.Drawing) as package sources in your nuget.config:

              <add key="webForCore" value="https://xforcore.github.io/webForCore/index.json" />
              <add key="drawingForCore" value="https://xforcore.github.io/drawingForCore/index.json" />

          Then reference \`webForCore\` (System.Web and what every application needs) and the packages for the frameworks the
          application uses (\`webForCore.Web.Mvc\`, \`webForCore.Web.Http.WebHost\`, ...). See docs/MIGRATING.md.
          NOTES
          # The version's own notes (docs/release-notes/<version>.md), when there are some.
          if [ -f "docs/release-notes/$VERSION.md" ]; then printf '\n' >> notes.md; cat "docs/release-notes/$VERSION.md" >> notes.md; fi
          gh release create "$GITHUB_REF_NAME" packages/*.nupkg packages/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --title "webForCore $VERSION" --notes-file notes.md --verify-tag

  # The NuGet feed on GitHub Pages, rebuilt from the latest releases (a release made with GITHUB_TOKEN doesn't start
  # other workflows, so it is called from here).
  feed:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml
