# Linux and Windows builds in parallel (Windows is the development environment, #46), every test suite on both (see
# docs/TESTING.md), and the NuGet packages: every run packs them, checks that an application builds and runs from them,
# and keeps Linux's as the "packages" artifact. A version tag (v0.1.0, matching <Version> in Directory.Build.props) also
# publishes them as a GitHub release, once both platforms pass, and rebuilds the NuGet feed on GitHub Pages (feed.yml).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Strong-name signing is RSA-SHA1; distributions whose OpenSSL policy rejects SHA-1 need this (harmless elsewhere).
  OPENSSL_ENABLE_SHA1_SIGNATURES: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    services:
      # Identity.Test's Entity Framework tests (LocalDB on Windows); the same server tools/ci/sqlserver.sh starts.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "webForCore-Test1!"
        ports:
          - 14333:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'webForCore-Test1!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Microsoft's code comes from submodules of cleared-down forks (external/, #61).
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The release version from Directory.Build.props; any other run builds a prerelease of it (0.1.0-ci.123).
      - name: Version
        id: version
        run: |
          base=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/v}" != "$base" ]]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match <Version>$base</Version> in Directory.Build.props"; exit 1
            fi
            version=$base
          else
            version=$base-ci.$GITHUB_RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core libfontconfig1

      # CONTRIBUTING.md rules 6 and 7 for webForCore's own code: no new non-public reflection, unsafe code, P/Invoke
      # or GC steering; the known exceptions are #57's list.
      - name: Code rules
        run: dotnet run tools/ci/check_code_rules.cs

      # LINQ to SQL's SR, Strings and Error classes and string resources (#142) are what tools/linq/generate.cs writes
      # from System.Data.Linq.txt and the committed data read from .NET Framework's System.Data.Linq.dll.
      - name: LINQ to SQL's generated code
        run: dotnet run tools/linq/generate.cs -- --check

      # The other projects import lib/WebFormsForCore.Build/*/FakeStrongName.targets, this project's output, so it is
      # built before the solution can even be restored.
      - name: Build the build tasks
        run: dotnet build src/WebFormsForCore.Build/WebFormsForCore.Build.csproj -c Release

      - name: Build
        run: dotnet build WebFormsForCore.slnx -c Release -nodeReuse:false -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: tools/ci/run-tests.sh "$RUNNER_TEMP/TestResults"

      - name: Test summary
        if: always()
        run: cat "$RUNNER_TEMP/TestResults/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      # src/WebFormsForCore.TestApp rebuilt with its pages newer than their designer files, then started (#80).
      - name: TestApp smoke test
        run: tools/ci/testapp-smoke.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

      # Every request WebApi.Gate.Tests sent to the Web API sample on Kestrel, with the response, for iis-compare (#78).
      - name: Upload the Web API gate's responses
        uses: actions/upload-artifact@v4
        with:
          name: gate-responses
          path: test/webForCore.WebApi.Gate.Tests/bin/Release/net10.0/gate-responses.json
          if-no-files-found: error

      # ... and every request IIS.Gate.Tests' RequestHandlingTests sent to test/webForCore.Requests.Sample (#126, #127,
      # #129, #140).
      - name: Upload the request handling responses
        uses: actions/upload-artifact@v4
        with:
          name: requests-responses
          path: test/webForCore.IIS.Gate.Tests/bin/Release/net10.0/requests-responses.json
          if-no-files-found: error

      - name: Pack
        run: tools/ci/pack.sh ${{ steps.version.outputs.version }} "$RUNNER_TEMP/packages"

      # Every assembly in the packages has the identity of the Microsoft assembly it replaces (name, version, culture,
      # public key token), read from Microsoft's NuGet package (#141: System.Web.Optimization was 11.0.0.0 with another
      # token, and BundleTransformer didn't compile against it).
      - name: Assembly identities
        run: dotnet run tools/ci/check_assembly_identities.cs -- "$RUNNER_TEMP/packages"

      # An application that references the webForCore package (not the projects) builds, runs and serves pages.
      - name: Package smoke test
        run: tools/ci/package-smoke.sh "$RUNNER_TEMP/packages" ${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

  # Windows as a development environment (#46): the same build, tests, packing and package smoke test. A required
  # check (docs/TESTING.md): renaming this job renames the check, so change the ruleset in the same change (#76).
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      # Check files out as they are stored, as on Linux: core.autocrlf would give the shell scripts CRLF line endings.
      - name: Line endings
        run: git config --global core.autocrlf false

      - name: Long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the build tasks
        run: dotnet build src/WebFormsForCore.Build/WebFormsForCore.Build.csproj -c Release

      - name: Build
        run: dotnet build WebFormsForCore.slnx -c Release -nodeReuse:false -p:Version=0.0.0-windows.${{ github.run_number }}

      # Service containers are Linux only: SQL Server Express on the same port and login instead.
      - name: SQL Server
        shell: pwsh
        run: tools/ci/sqlserver-windows.ps1

      - name: Test
        run: tools/ci/run-tests.sh "$RUNNER_TEMP/TestResults"

      - name: Test summary
        if: always()
        run: cat "$RUNNER_TEMP/TestResults/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      # src/WebFormsForCore.TestApp rebuilt with its pages newer than their designer files, then started (#80).
      - name: TestApp smoke test
        run: tools/ci/testapp-smoke.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

      - name: Pack
        run: tools/ci/pack.sh 0.0.0-windows.${{ github.run_number }} "$RUNNER_TEMP/packages"

      - name: Assembly identities
        run: dotnet run tools/ci/check_assembly_identities.cs -- "$RUNNER_TEMP/packages"

      - name: Package smoke test
        run: tools/ci/package-smoke.sh "$RUNNER_TEMP/packages" 0.0.0-windows.${{ github.run_number }}

  # The Web API gate on IIS 10 (#78): the same sample built for .NET Framework 4.8 against Microsoft's packages, served by
  # IIS (integrated pipeline; the classic one is recorded too), gets the requests WebApi.Gate.Tests sent to it on Kestrel (Linux), and
  # tools/ci/iis_compare.cs diffs the responses. A difference that tools/ci/iis-known-differences.json doesn't list (and
  # docs/IIS-COMPATIBILITY.md doesn't record), or a listed one that no longer occurs, fails the job. It needs nothing of
  # webForCore's build, so it takes a few minutes once build-and-test is done. Not a required check (docs/TESTING.md).
  # Then the same for request handling (#126, #127, #129, #140): test/webForCore.Requests.Sample, served by IIS as it is,
  # gets the requests IIS.Gate.Tests' RequestHandlingTests sent to it, compared with the classic pipeline
  # (tools/ci/iis-known-differences-requests.json). Then <httpRuntime fcnMode> (#167): the changes that restart an application
  # in Single and Default mode, against what Host.Tests asserts of webForCore (tools/ci/iis_fcn.cs).
  iis-compare:
    needs: build-and-test
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: gate-responses
          path: ${{ runner.temp }}/gate

      - name: Build the sample for .NET Framework 4.8
        run: dotnet build test/webForCore.WebApi.Sample.Iis/webForCore.WebApi.Sample.Iis.csproj -c Release -nodeReuse:false "-p:IisSiteDirectory=$RUNNER_TEMP/site/"

      # The sample is Visual Studio's Web API template with Katana's System.Web host, written for the integrated
      # pipeline, as IIS's default application pool runs it: in the classic pipeline, Katana's OwinHttpModule fails every
      # request (500, "This operation requires IIS integrated pipeline mode"). So the comparison is with the integrated
      # pipeline; the classic one is recorded too (docs/IIS-COMPATIBILITY.md, "Compared with IIS 10").
      - name: IIS 10
        shell: powershell
        run: |
          tools/ci/iis-site.ps1 -Path "$env:RUNNER_TEMP\site" -Name gate-integrated -Port 8090 -Pipeline Integrated
          tools/ci/iis-site.ps1 -Path "$env:RUNNER_TEMP\site" -Name gate-classic -Port 8091 -Pipeline Classic

      - name: Send the gate's requests to IIS
        run: |
          dotnet run tools/ci/iis_compare.cs -- replay "$RUNNER_TEMP/gate/gate-responses.json" http://localhost:8090/ "$RUNNER_TEMP/gate/iis-integrated-responses.json"
          dotnet run tools/ci/iis_compare.cs -- replay "$RUNNER_TEMP/gate/gate-responses.json" http://localhost:8091/ "$RUNNER_TEMP/gate/iis-classic-responses.json"

      - name: Compare
        run: |
          set -o pipefail
          dotnet run tools/ci/iis_compare.cs -- diff "$RUNNER_TEMP/gate/gate-responses.json" "$RUNNER_TEMP/gate/iis-integrated-responses.json" \
            "--title=IIS 10 (integrated pipeline)" | tee -a "$GITHUB_STEP_SUMMARY"
          # The classic pipeline: for the record only, the sample doesn't run there on IIS.
          dotnet run tools/ci/iis_compare.cs -- diff "$RUNNER_TEMP/gate/gate-responses.json" "$RUNNER_TEMP/gate/iis-classic-responses.json" \
            "--title=IIS 10 (classic pipeline, for the record)" --informational > "$RUNNER_TEMP/gate/iis-classic.md"
          head -3 "$RUNNER_TEMP/gate/iis-classic.md" | tee -a "$GITHUB_STEP_SUMMARY"

      # Request handling (#126, #127, #129, #140): test/webForCore.Requests.Sample is pages, App_Code and static files
      # only, so IIS serves the folder as it is (webForCore's build output and Program.cs aside). The comparison is with
      # the classic pipeline, webForCore's; the integrated one is recorded too.
      - uses: actions/download-artifact@v4
        with:
          name: requests-responses
          path: ${{ runner.temp }}/gate

      - name: The request handling sample's site
        run: |
          cp -r test/webForCore.Requests.Sample "$RUNNER_TEMP/requests-site"
          rm -rf "$RUNNER_TEMP/requests-site/bin_dotnet" "$RUNNER_TEMP/requests-site/obj"

      - name: Request handling sample on IIS 10
        shell: powershell
        run: |
          tools/ci/iis-site.ps1 -Path "$env:RUNNER_TEMP\requests-site" -Name requests-classic -Port 8092 -Pipeline Classic
          tools/ci/iis-site.ps1 -Path "$env:RUNNER_TEMP\requests-site" -Name requests-integrated -Port 8093 -Pipeline Integrated

      - name: Send the request handling requests to IIS
        run: |
          dotnet run tools/ci/iis_compare.cs -- replay "$RUNNER_TEMP/gate/requests-responses.json" http://localhost:8092/ "$RUNNER_TEMP/gate/iis-requests-classic-responses.json"
          dotnet run tools/ci/iis_compare.cs -- replay "$RUNNER_TEMP/gate/requests-responses.json" http://localhost:8093/ "$RUNNER_TEMP/gate/iis-requests-integrated-responses.json"

      - name: Compare request handling
        run: |
          set -o pipefail
          dotnet run tools/ci/iis_compare.cs -- diff "$RUNNER_TEMP/gate/requests-responses.json" "$RUNNER_TEMP/gate/iis-requests-classic-responses.json" \
            tools/ci/iis-known-differences-requests.json "--gate=Request handling" "--title=IIS 10 (classic pipeline)" | tee -a "$GITHUB_STEP_SUMMARY"
          # The integrated pipeline: for the record (it adds HTTP_URL, UNENCODED_URL and CACHE_URL, ServerVariables.aspx).
          dotnet run tools/ci/iis_compare.cs -- diff "$RUNNER_TEMP/gate/requests-responses.json" "$RUNNER_TEMP/gate/iis-requests-integrated-responses.json" \
            tools/ci/iis-known-differences-requests.json "--gate=Request handling" "--title=IIS 10 (integrated pipeline, for the record)" --informational > "$RUNNER_TEMP/gate/iis-requests-integrated.md"
          head -3 "$RUNNER_TEMP/gate/iis-requests-integrated.md" | tee -a "$GITHUB_STEP_SUMMARY"

      # <httpRuntime fcnMode> (#167): which changes restart an application on IIS, in Single and Default mode, compared
      # with what Host.Tests asserts of webForCore (tools/ci/iis_fcn.cs). The compared sites are written before IIS serves
      # them; a third is written after, as a deployment copies a site, and its start is recorded only (IIS varies).
      - name: fcnMode sites
        run: |
          dotnet run tools/ci/iis_fcn.cs -- site "$RUNNER_TEMP/fcn-Single" Single
          dotnet run tools/ci/iis_fcn.cs -- site "$RUNNER_TEMP/fcn-Default" Default
          mkdir -p "$RUNNER_TEMP/fcn-Fresh/App_Data"

      - name: fcnMode sites on IIS 10
        shell: powershell
        run: |
          tools/ci/iis-site.ps1 -Path "$env:RUNNER_TEMP\fcn-Single" -Name fcn-single -Port 8094 -Pipeline Classic
          tools/ci/iis-site.ps1 -Path "$env:RUNNER_TEMP\fcn-Default" -Name fcn-default -Port 8095 -Pipeline Classic
          tools/ci/iis-site.ps1 -Path "$env:RUNNER_TEMP\fcn-Fresh" -Name fcn-fresh -Port 8096 -Pipeline Classic
          # Global.asax writes each shutdown's reason to App_Data.
          foreach ($site in 'Single', 'Default', 'Fresh') { icacls "$env:RUNNER_TEMP\fcn-$site\App_Data" /grant "IIS_IUSRS:(OI)(CI)M" /T /Q }

      - name: Changes that restart an application (fcnMode)
        run: |
          dotnet run tools/ci/iis_fcn.cs -- site "$RUNNER_TEMP/fcn-Fresh" Single
          echo "## Changes that restart an application (#167)" > "$RUNNER_TEMP/gate/iis-fcn.md"
          status=0
          dotnet run tools/ci/iis_fcn.cs -- check "$RUNNER_TEMP/fcn-Single" http://localhost:8094/ Single "$RUNNER_TEMP/gate/iis-fcn.md" || status=1
          dotnet run tools/ci/iis_fcn.cs -- check "$RUNNER_TEMP/fcn-Default" http://localhost:8095/ Default "$RUNNER_TEMP/gate/iis-fcn.md" || status=1
          dotnet run tools/ci/iis_fcn.cs -- check "$RUNNER_TEMP/fcn-Fresh" http://localhost:8096/ Single "$RUNNER_TEMP/gate/iis-fcn.md" fresh
          cat "$RUNNER_TEMP/gate/iis-fcn.md" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iis-responses
          path: |
            ${{ runner.temp }}/gate/*.json
            ${{ runner.temp }}/gate/*.md
          if-no-files-found: warn

  # LINQ to SQL's errors and messages (#142): webForCore generates System.Data.Linq's Error and Strings classes, which
  # referencesource doesn't publish, from src/webForCore.System.Data.Linq/FrameworkData/System.Data.Linq.json, data
  # read from .NET Framework 4.8's System.Data.Linq.dll (names, messages and exception types). This job reads that
  # assembly on Windows again and fails if the committed data differs. It needs nothing of webForCore's build. Not a
  # required check (docs/TESTING.md).
  linq-framework-data:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read .NET Framework's System.Data.Linq.dll
        run: |
          gac='C:\Windows\Microsoft.NET\assembly\GAC_MSIL\System.Data.Linq\v4.0_4.0.0.0__b77a5c561934e089\System.Data.Linq.dll'
          ls -l "$(cygpath -u "$gac")" /c/Windows/Microsoft.NET/Framework64/v4.0.30319/System.Data.Linq.dll || true
          committed=src/webForCore.System.Data.Linq/FrameworkData/System.Data.Linq.json
          dotnet run tools/linq/framework_data.cs -- "$gac" "$RUNNER_TEMP/linq/System.Data.Linq.json" \
            $( [ -f "$committed" ] && echo "$committed" )

      - name: Upload the data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linq-framework-data
          path: ${{ runner.temp }}/linq/
          if-no-files-found: warn

  # The BinaryFormatter port's wire format (#156): tools/serialization/FrameworkStreams writes the graphs of
  # test/webForCore.Serialization.Tests/FrameworkStreams/FrameworkStreamCases.cs with .NET Framework 4.8's
  # BinaryFormatter, reads them back, and fails if a committed stream (FrameworkStreams/*.bin, which Serialization.Tests
  # reads and checks the port writes byte for byte) differs or doesn't read on .NET Framework. The streams are uploaded
  # as an artifact, to commit when a case is added. It needs nothing of webForCore's build. Not a required check
  # (docs/TESTING.md).
  serialization-framework-streams:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Write the streams with .NET Framework's BinaryFormatter
        run: |
          dotnet build tools/serialization/FrameworkStreams/FrameworkStreams.csproj -c Release -nodeReuse:false
          committed=test/webForCore.Serialization.Tests/FrameworkStreams
          tools/serialization/FrameworkStreams/bin/Release/net48/FrameworkStreams.exe "$RUNNER_TEMP/streams" \
            $( ls "$committed"/*.bin > /dev/null 2>&1 && echo "$committed" )

      - name: Upload the streams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serialization-framework-streams
          path: ${{ runner.temp }}/streams/
          if-no-files-found: warn

  # aspnet_regsql's scripts (#123): System.Web carries .NET Framework 4.8's InstallCommon.sql, InstallMembership.sql and
  # the others (src/WebFormsForCore.Web/FrameworkData/Sql), which referencesource doesn't publish, and IIS.Gate.Tests
  # compares webforcore-regsql -sqlexportonly with aspnet_regsql's output (test/webForCore.IIS.Gate.Tests/FrameworkData).
  # This job reads the framework folder and runs aspnet_regsql on Windows again, and fails if the committed files differ.
  # It needs nothing of webForCore's build. Not a required check (docs/TESTING.md).
  regsql-framework-data:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Compare the scripts and aspnet_regsql's exports
        run: |
          framework=/c/Windows/Microsoft.NET/Framework64/v4.0.30319
          out="$RUNNER_TEMP/regsql"; mkdir -p "$out/Sql"
          find "$framework" -maxdepth 1 -iname '*.sql' -exec cp {} "$out/Sql/" \;
          "$framework/aspnet_regsql.exe" -sqlexportonly "$(cygpath -w "$out/aspnet_regsql-A-all-d-aspnetdb.sql")" -A all -d aspnetdb
          "$framework/aspnet_regsql.exe" -sqlexportonly "$(cygpath -w "$out/aspnet_regsql-ssadd-sstype-t.sql")" -ssadd -sstype t
          diff -r --brief src/WebFormsForCore.Web/FrameworkData/Sql "$out/Sql"
          for f in aspnet_regsql-A-all-d-aspnetdb.sql aspnet_regsql-ssadd-sstype-t.sql; do
            cmp "test/webForCore.IIS.Gate.Tests/FrameworkData/$f" "$out/$f"
          done

      - name: Upload the files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regsql-framework-data
          path: ${{ runner.temp }}/regsql/
          if-no-files-found: warn

  # A version tag: the tested packages become a GitHub release (not published to nuget.org), and the feed is rebuilt.
  release:
    # Both platforms must pass: Windows is the development environment (#46).
    needs: [build-and-test, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          webForCore $VERSION as NuGet packages, on the feed https://xforcore.github.io/webForCore/index.json (not on
          nuget.org). Add it and drawingForCore's feed (System.Drawing) as package sources in your nuget.config:

              <add key="webForCore" value="https://xforcore.github.io/webForCore/index.json" />
              <add key="drawingForCore" value="https://xforcore.github.io/drawingForCore/index.json" />

          Then reference \`webForCore\` (System.Web and what every application needs) and the packages for the frameworks the
          application uses (\`webForCore.Web.Mvc\`, \`webForCore.Web.Http.WebHost\`, ...). See docs/MIGRATING.md.
          NOTES
          # The version's own notes (docs/release-notes/<version>.md), when there are some.
          if [ -f "docs/release-notes/$VERSION.md" ]; then printf '\n' >> notes.md; cat "docs/release-notes/$VERSION.md" >> notes.md; fi
          gh release create "$GITHUB_REF_NAME" packages/*.nupkg packages/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --title "webForCore $VERSION" --notes-file notes.md --verify-tag

  # The NuGet feed on GitHub Pages, rebuilt from the latest releases (a release made with GITHUB_TOKEN doesn't start
  # other workflows, so it is called from here).
  feed:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml
