# The NuGet feed on GitHub Pages (https://xforcore.github.io/webForCore/index.json): a static NuGet v3 feed,
# generated by Sleet from the .nupkg files of the latest releases and deployed as the Pages site. Nothing is committed;
# the packages stay stored in the releases, and older versions are downloadable from theirs. Runs after a release
# (ci.yml) or by hand.
name: NuGet feed

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # How many releases the feed keeps: a release is about 92 MB, and a Pages site may be 1 GB.
  KEEP: "5"

jobs:
  feed:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}index.json
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Packages of the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir packages
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit "$KEEP" --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.nupkg' --dir packages
            echo "$tag"
          done
          ls packages

      - name: Feed
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" sleet --version 7.2.0
          cat > sleet.json <<JSON
          {
            "sources": [
              { "name": "feed", "type": "local", "path": "site", "baseURI": "${BASE_URL%/}/" }
            ]
          }
          JSON
          "$RUNNER_TEMP/tools/sleet" init --config sleet.json --source feed
          "$RUNNER_TEMP/tools/sleet" push packages --config sleet.json --source feed
          "$RUNNER_TEMP/tools/sleet" validate --config sleet.json --source feed

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
